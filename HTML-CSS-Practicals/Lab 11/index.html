    <!DOCTYPE html>
<html>
<head>
    <title>Accessible Marks</title>
    <link rel="stylesheet" href="marks-accessible.css">
</head>
<body>

    <table>

        <caption>Marks of Class A</caption>

        <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Maths</th>
                <th scope="col">Science</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th scope="row">Asha</th>
                <td>78</td>
                <td>85</td>
            </tr>

            <tr>
                <th scope="row">Rohan</th>
                <td>64</td>
                <td>70</td>
            </tr>
        </tbody>

    </table>

</body>
</html>
