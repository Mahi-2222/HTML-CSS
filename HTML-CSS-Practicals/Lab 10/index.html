<!DOCTYPE html>
<html>
<head>
    <title>Inline Internal CSS</title>

    <style>
        h1 {
            color: navy;
        }

        .highlight {
            background-color: yellow;
        }
    </style>

</head>
<body>

    <h1>Welcome to CSS</h1>

    <p style="color: red;">
        This is a red paragraph.
    </p>

    <p class="highlight">
        This is a yellow paragraph.
    </p>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>CSS Styling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My Website</h1>

    <p class="note">This is my first paragraph.</p>

    <p>This is my second paragraph.</p>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>External CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 id="title">My Website</h1>

    <p class="note">This is my first paragraph.</p>

    <p class="note">This is my second paragraph.</p>

</body>
</html>
